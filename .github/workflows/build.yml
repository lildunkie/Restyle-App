# Builds and tests every push and pull request. When a version tag like v1.0.0 is pushed, it also
# publishes Restyle.exe and attaches Restyle-win-x64.zip to a GitHub Release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        # RealMachineTests read the live desktop's settings, which CI servers don't have.
        run: dotnet test tests/Restyle.Core.Tests -c Release --filter "FullyQualifiedName!~RealMachineTests"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/Restyle.App -p:PublishProfile=win-x64 -p:Version=$version
          Compress-Archive -Path publish/Restyle.exe, publish/Presets, LICENSE -DestinationPath Restyle-win-x64.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Restyle-win-x64.zip
          generate_release_notes: true
